name: dependency-graph-pr

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - uses: ./.github/actions/dependency-graph-pr
        with:
          base: origin/${{ github.base_ref }}
          head: HEAD
          dependency-graph-command: bun run apps/api/src/cli.ts
