apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-graph-api
spec:
  template:
    spec:
      serviceAccountName: dependency-graph-api
      containers:
        - name: api
          image: dependency-graph/api:latest
---
apiVersion: v1
kind: Service
metadata:
  name: dependency-graph-api
spec:
  selector:
    app: dependency-graph-api
